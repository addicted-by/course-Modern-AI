<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" font-family="Arial, sans-serif" fill="#1a1a1a">
  <title>Four rank components with two different parameter costs</title>
  <g font-size="14">
    <text x="7" y="19">N · 1024 × 1024 · 2,048 per component</text>
    <text x="7" y="43">W · 4096 × 1024 · 5,120 per component</text>
  </g>
  <g font-size="15" font-weight="700">
    <text x="7" y="83">3 × N + 1 × W</text>
    <text x="352" y="83" text-anchor="end">11,264</text>
    <text x="7" y="149">1 × N + 3 × W</text>
    <text x="352" y="149" text-anchor="end">17,408</text>
  </g>
  <g stroke="#1a1a1a">
    <rect x="7" y="95" width="40" height="30" fill="#f3f3f3"/>
    <rect x="47" y="95" width="40" height="30" fill="#f3f3f3"/>
    <rect x="87" y="95" width="40" height="30" fill="#f3f3f3"/>
    <rect x="127" y="95" width="100" height="30" fill="#effbd9"/>
    <rect x="7" y="161" width="40" height="30" fill="#f3f3f3"/>
    <rect x="47" y="161" width="100" height="30" fill="#effbd9"/>
    <rect x="147" y="161" width="100" height="30" fill="#effbd9"/>
    <rect x="247" y="161" width="100" height="30" fill="#effbd9"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <text x="27" y="115">N</text><text x="67" y="115">N</text><text x="107" y="115">N</text><text x="177" y="115">W</text>
    <text x="27" y="181">N</text><text x="97" y="181">W</text><text x="197" y="181">W</text><text x="297" y="181">W</text>
  </g>
  <text x="352" y="213" text-anchor="end" font-size="14" fill="#52525b">Trainable parameters</text>
</svg>
