      <text x="51" y="69">74</text>
      <text x="51" y="138">73.5</text>
      <text x="51" y="207">73</text>
    </g>
    <path d="M76 144L150 158 223 102 297 89 518 130" fill="none" stroke="#52525b" stroke-width="2" stroke-dasharray="4 4"/>
    <g fill="#bef264" stroke="#1a1a1a" stroke-width="2">
