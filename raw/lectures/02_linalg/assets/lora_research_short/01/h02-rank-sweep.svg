    <g text-anchor="middle" font-size="23" font-weight="bold">
      <text x="76" y="128">73.4</text>
      <text x="150" y="142">73.3</text>
      <text x="223" y="86">73.7</text>
      <text x="297" y="73">73.8</text>
      <text x="518" y="114">73.5</text>
    </g>
    <g text-anchor="middle" font-size="23">
      <text x="76" y="228">1</text>
      <text x="150" y="228">2</text>
      <text x="223" y="228">4</text>
      <text x="297" y="228">8</text>
      <text x="518" y="228">64</text>
      <text x="295" y="271">Rank per matrix (log scale)</text>
