<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 110" role="img" aria-label="Causal encoder–decoder. How a prompt reaches the decoder. 1  ENCODE 20 causal layers 8B active during prefill; 2  SHARE Global KV from encoder 890 bytes per token in FP4; 3  DECODE 20 decoder layers 16B active during decode."><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1456" height="110" rx="0" fill="#f5f8fa"/><rect x="0" y="0" width="6" height="110" rx="0" fill="#176586"/><text x="22" y="43" fill="#152b38" font-size="24" font-weight="700" >Causal encoder–decoder</text><text x="22" y="74" fill="#425866" font-size="19" font-weight="500" >How a prompt reaches the decoder</text><rect x="324" y="16" width="1" height="78" rx="0" fill="#c6d4db"/><text x="338" y="31" fill="#425866" font-size="16" font-weight="700" >1  ENCODE</text><text x="338" y="63" fill="#152b38" font-size="25" font-weight="700" >20 causal layers</text><text x="338" y="90" fill="#425866" font-size="18" font-weight="500" >8B active during prefill</text><rect x="695" y="16" width="1" height="78" rx="0" fill="#c6d4db"/><text x="709" y="31" fill="#425866" font-size="16" font-weight="700" >2  SHARE</text><text x="709" y="63" fill="#152b38" font-size="25" font-weight="700" >Global KV from encoder</text><text x="709" y="90" fill="#425866" font-size="18" font-weight="500" >890 bytes per token in FP4</text><rect x="1065" y="16" width="1" height="78" rx="0" fill="#c6d4db"/><text x="1079" y="31" fill="#425866" font-size="16" font-weight="700" >3  DECODE</text><text x="1079" y="63" fill="#152b38" font-size="25" font-weight="700" >20 decoder layers</text><text x="1079" y="90" fill="#425866" font-size="18" font-weight="500" >16B active during decode</text></g></svg>
