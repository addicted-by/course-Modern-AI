<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="112" viewBox="0 0 1456 112" role="img" aria-labelledby="title desc"><title id="title">Does score planning help?</title><desc id="desc">For the same YuE2 checkpoint, 49.3% preferred score planning, 16.1% tied, and 34.6% preferred direct generation.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1456" height="112" fill="#ffffff"/><text x="12" y="45" font-size="29" font-weight="700" fill="#172119" text-anchor="start">Does score planning help?</text><text x="12" y="77" font-size="20" font-weight="400" fill="#45564a" text-anchor="start">Blind A/B · 211 overall-quality judgments</text><rect x="428.0" y="9" width="502.9" height="92" fill="#bef264"/><text x="441" y="45" font-size="20" font-weight="400" fill="#172119" text-anchor="start">With score</text><text x="441" y="84" font-size="32" font-weight="700" fill="#172119" text-anchor="start">49.3%</text><rect x="930.9" y="9" width="164.2" height="92" fill="#dce3dc"/><text x="943.86" y="45" font-size="20" font-weight="400" fill="#172119" text-anchor="start">Tie</text><text x="943.86" y="84" font-size="32" font-weight="700" fill="#172119" text-anchor="start">16.1%</text><rect x="1095.1" y="9" width="352.9" height="92" fill="#44804c"/><text x="1108.08" y="45" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">Without score</text><text x="1108.08" y="84" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">34.6%</text></g></svg>
