<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="112" viewBox="0 0 1456 112" role="img" aria-labelledby="title desc"><title id="title">MiniMax Music 3 hidden-state synthesis</title><desc id="desc">Global + local LMs, 8B across frames · 0.6B within frames → Fuse hidden states, Combine both LM streams → Flow matching, 2.4B · generate latents → Decode a waveform, 123M Flow-VAE · 32 kHz stereo</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1456" height="112" fill="#ffffff"/><rect x="0" y="6" width="390" height="100" fill="#edf2ea"/><text x="17" y="46" font-size="27" font-weight="700" fill="#172119" text-anchor="start">Global + local LMs</text><text x="17" y="78" font-size="20" font-weight="400" fill="#172119" text-anchor="start">8B across frames · 0.6B within frames</text><path d="M396 56 h16 m-6 -6 l6 6 -6 6" fill="none" stroke="#45564a" stroke-width="3"/><rect x="422" y="6" width="300" height="100" fill="#bef264"/><text x="439" y="46" font-size="27" font-weight="700" fill="#172119" text-anchor="start">Fuse hidden states</text><text x="439" y="78" font-size="20" font-weight="400" fill="#172119" text-anchor="start">Combine both LM streams</text><path d="M728 56 h16 m-6 -6 l6 6 -6 6" fill="none" stroke="#45564a" stroke-width="3"/><rect x="754" y="6" width="310" height="100" fill="#edf2ea"/><text x="771" y="46" font-size="27" font-weight="700" fill="#172119" text-anchor="start">Flow matching</text><text x="771" y="78" font-size="20" font-weight="400" fill="#172119" text-anchor="start">2.4B · generate latents</text><path d="M1070 56 h16 m-6 -6 l6 6 -6 6" fill="none" stroke="#45564a" stroke-width="3"/><rect x="1096" y="6" width="360" height="100" fill="#edf2ea"/><text x="1113" y="46" font-size="27" font-weight="700" fill="#172119" text-anchor="start">Decode a waveform</text><text x="1113" y="78" font-size="20" font-weight="400" fill="#172119" text-anchor="start">123M Flow-VAE · 32 kHz stereo</text></g></svg>
