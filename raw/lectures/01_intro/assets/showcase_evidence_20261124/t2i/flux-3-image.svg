<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="112" viewBox="0 0 1456 112" role="img" aria-labelledby="title desc">
<title id="title">Self-Flow uses two noise levels</title>
<desc id="desc">The student sees a mix of noisier and cleaner tokens. The EMA teacher sees all tokens at the cleaner level. The student learns flow and feature alignment together.</desc>
<g font-family="Arial, Helvetica, sans-serif">
