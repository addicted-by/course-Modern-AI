eight="26" fill="#d3e6e1" stroke="#96aca6" stroke-width="1"/><path d="M800,55 L880,55" fill="none" stroke="#006658" stroke-width="2"/><path d="M873,51 L880,55 L873,59" stroke="#006658" stroke-width="2" fill="none"/><text x="907" y="42" font-size="24" fill="#17292e" font-weight="700" text-anchor="start">Match the teacher’s hidden features</text><text x="907" y="74" font-size="22" fill="#43565b" font-weight="400" text-anchor="start">while learning the denoising direction.</text>
