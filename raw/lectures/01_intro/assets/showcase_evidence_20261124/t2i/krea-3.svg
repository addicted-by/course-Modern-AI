<svg xmlns="http://www.w3.org/2000/svg" width="326" height="208" viewBox="0 0 326 208" role="img" aria-labelledby="title desc">
<title id="title">Three inputs to the diffusion transformer</title>
<desc id="desc">Krea 3’s diffusion transformer receives image-conditioned instruction tokens, clean reference-image latents, and noisy target-image latents.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<text x="4" y="24" font-size="21" fill="#17292e" font-weight="700" text-anchor="start">Three inputs to one DiT</text><text x="4" y="47" font-size="15" fill="#43565b" font-weight="400" text-anchor="start">Krea 3 · image editing architecture</text><rect x="4" y="61" width="216" height="30" fill="#d6e8e4" stroke="none" stroke-width="1"/><text x="12" y="82" font-size="16" fill="#17292e" font-weight="700" text-anchor="start">VLM instruction tokens</text><path d="M220,76 L234,76" fill="none" stroke="#006658" stroke-width="2"/><rect x="4" y="99" width="216" height="30" fill="#d6e8e4" stroke="none" stroke-width="1"/><text x="12" y="120" font-size="16" fill="#17292e" font-weight="700" text-anchor="start">Clean reference latents</text><path d="M220,114 L234,114" fill="none" stroke="#006658" stroke-width="2"/><rect x="4" y="137" width="216" height="30" fill="#d6e8e4" stroke="none" stroke-width="1"/><text x="12" y="158" font-size="16" fill="#17292e" font-weight="700" text-anchor="start">Noisy target latents</text><path d="M220,152 L234,152" fill="none" stroke="#006658" stroke-width="2"/><path d="M234,76 L234,152" fill="none" stroke="#006658" stroke-width="2"/><path d="M234,114 L248,114" fill="none" stroke="#006658" stroke-width="2"/><path d="M241,110 L248,114 L241,118" stroke="#006658" stroke-width="2" fill="none"/><rect x="250" y="88" width="71" height="51" fill="#006658" stroke="none" stroke-width="1"/><text x="285" y="119" font-size="23" fill="white" font-weight="700" text-anchor="middle">DiT</text><text x="4" y="193" font-size="15" fill="#43565b" font-weight="400" text-anchor="start">Reference latents stay clean at t = 0.</text>
</g>
</svg>
