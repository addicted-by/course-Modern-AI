<svg xmlns="http://www.w3.org/2000/svg" width="326" height="208" viewBox="0 0 326 208" role="img" aria-labelledby="title desc">
<title id="title">Unsafe images shown</title>
<desc id="desc">On adversarial prompts, unsafe outputs shown were 1.64% for Images 2.0, 1.41% for Flare and 1.09% for Sunburst. Differences versus 2.0 were statistically inconclusive.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<text x="4" y="24" font-size="21" fill="#17292e" font-weight="700" text-anchor="start">Unsafe images shown</text><text x="4" y="47" font-size="15" fill="#43565b" font-weight="400" text-anchor="start">Adversarial prompts · scale 0–2%</text><text x="4" y="72" font-size="16" fill="#17292e" font-weight="400" text-anchor="start">Images 2.0</text><text x="321" y="72" font-size="17" fill="#006658" font-weight="700" text-anchor="end">1.64%</text><rect x="4" y="77" width="316" height="5" fill="#e4eeea" stroke="none" stroke-width="1"/><rect x="4" y="77" width="259.12" height="5" fill="#006658" stroke="none" stroke-width="1"/><text x="4" y="105" font-size="16" fill="#17292e" font-weight="400" text-anchor="start">2.5 Flare</text><text x="321" y="105" font-size="17" fill="#006658" font-weight="700" text-anchor="end">1.41%</text><rect x="4" y="110" width="316" height="5" fill="#e4eeea" stroke="none" stroke-width="1"/><rect x="4" y="110" width="222.78" height="5" fill="#006658" stroke="none" stroke-width="1"/><text x="4" y="138" font-size="16" fill="#17292e" font-weight="400" text-anchor="start">2.5 Sunburst</text><text x="321" y="138" font-size="17" fill="#006658" font-weight="700" text-anchor="end">1.09%</text><rect x="4" y="143" width="316" height="5" fill="#e4eeea" stroke="none" stroke-width="1"/><rect x="4" y="143" width="172.22" height="5" fill="#006658" stroke="none" stroke-width="1"/><text x="4" y="184" font-size="18" fill="#43565b" font-weight="400" text-anchor="start">No clear difference from 2.0.</text>
</g>
</svg>
