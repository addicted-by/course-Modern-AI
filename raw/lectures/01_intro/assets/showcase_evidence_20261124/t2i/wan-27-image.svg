<svg xmlns="http://www.w3.org/2000/svg" width="326" height="208" viewBox="0 0 326 208" role="img" aria-labelledby="title desc">
<title id="title">Specifying a color palette</title>
<desc id="desc">Eight bands have widths proportional to the HEX-color shares in Alibaba’s sample API request. The first two request 23.51% and 20.13%.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<text x="4" y="24" font-size="21" fill="#17292e" font-weight="700" text-anchor="start">Specifying a color palette</text><text x="4" y="47" font-size="15" fill="#43565b" font-weight="400" text-anchor="start">Eight-color input in Alibaba’s API example</text><rect x="5" y="61" width="74.292" height="51" fill="#C2D1E6" stroke="#fff" stroke-width="1"/><rect x="79.292" y="61" width="63.611" height="51" fill="#CDD8E9" stroke="#fff" stroke-width="1"/><rect x="142.902" y="61" width="50.181" height="51" fill="#B5C8DB" stroke="#fff" stroke-width="1"/><rect x="193.083" y="61" width="41.933" height="51" fill="#C0B5B4" stroke="#fff" stroke-width="1"/><rect x="235.016" y="61" width="31.948" height="51" fill="#DAE0EC" stroke="#fff" stroke-width="1"/><rect x="266.964" y="61" width="28.219" height="51" fill="#636574" stroke="#fff" stroke-width="1"/><rect x="295.183" y="61" width="17.538" height="51" fill="#CACAD2" stroke="#fff" stroke-width="1"/><rect x="312.721" y="61" width="8.279" height="51" fill="#CBD4E4" stroke="#fff" stroke-width="1"/><text x="4" y="137" font-size="19" fill="#17292e" font-weight="700" text-anchor="start">#C2D1E6</text><text x="321" y="137" font-size="19" fill="#17292e" font-weight="700" text-anchor="end">23.51%</text><text x="4" y="161" font-size="17" fill="#43565b" font-weight="400" text-anchor="start">#CDD8E9</text><text x="321" y="161" font-size="17" fill="#43565b" font-weight="400" text-anchor="end">20.13%</text><text x="4" y="195" font-size="15" fill="#43565b" font-weight="400" text-anchor="start">Requested shares total 100.00%.</text>
</g>
</svg>
