<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="112" viewBox="0 0 1456 112" role="img" aria-labelledby="title desc">
<title id="title">Effects of quantization</title>
<desc id="desc">BFL reports up to 1.6× speedup and 40% less VRAM for FP8, and up to 2.7× speedup and 55% less VRAM for NVFP4, at 1024 squared on RTX 5080/5090.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<text x="12" y="36" font-size="27" fill="#17292e" font-weight="700" text-anchor="start">Quantizing FLUX.2 [klein]</text><text x="12" y="67" font-size="22" fill="#43565b" font-weight="400" text-anchor="start">1024 × 1024 · RTX 5080 / 5090</text><text x="12" y="95" font-size="18" fill="#43565b" font-weight="400" text-anchor="start">Best gains reported by Black Forest Labs.</text><path d="M570,12 L570,99" fill="none" stroke="#bfceca" stroke-width="2"/><text x="600" y="28" font-size="22" fill="#006658" font-weight="700" text-anchor="start">FP8</text><text x="600" y="60" font-size="26" fill="#17292e" font-weight="700" text-anchor="start">1.6× speedup</text><text x="600" y="90" font-size="20" fill="#43565b" font-weight="400" text-anchor="start">up to 40% less VRAM</text><path d="M980,12 L980,99" fill="none" stroke="#bfceca" stroke-width="2"/><text x="1010" y="28" font-size="22" fill="#006658" font-weight="700" text-anchor="start">NVFP4</text><text x="1010" y="60" font-size="26" fill="#17292e" font-weight="700" text-anchor="start">2.7× speedup</text><text x="1010" y="90" font-size="20" fill="#43565b" font-weight="400" text-anchor="start">up to 55% less VRAM</text>
</g>
</svg>
