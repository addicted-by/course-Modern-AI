<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="112" viewBox="0 0 1456 112" role="img" aria-labelledby="title desc">
<title id="title">Autoencoder reconstruction quality</title>
<desc id="desc">ImageNet validation reconstruction FID is 0.6451 for SD, 0.1761 for FLUX.1 and 0.1124 for FLUX.2. Lower is better.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<text x="12" y="36" font-size="27" fill="#17292e" font-weight="700" text-anchor="start">Reconstructing ImageNet images</text><text x="12" y="65" font-size="23" fill="#43565b" font-weight="400" text-anchor="start">Autoencoder only · rFID ↓</text><text x="12" y="92" font-size="19" fill="#43565b" font-weight="400" text-anchor="start">All rows use the same validation set.</text><text x="570" y="31" font-size="21" fill="#17292e" font-weight="700" text-anchor="start">SD</text><rect x="700" y="18" width="550" height="15" fill="#e7efed" stroke="none" stroke-width="1"/><rect x="700" y="18" width="506.86" height="15" fill="#819d98" stroke="none" stroke-width="1"/><text x="1375" y="32" font-size="22" fill="#17292e" font-weight="700" text-anchor="end">0.6451</text><text x="570" y="65" font-size="21" fill="#17292e" font-weight="700" text-anchor="start">FLUX.1</text><rect x="700" y="52" width="550" height="15" fill="#e7efed" stroke="none" stroke-width="1"/><rect x="700" y="52" width="138.36" height="15" fill="#819d98" stroke="none" stroke-width="1"/><text x="1375" y="66" font-size="22" fill="#17292e" font-weight="700" text-anchor="end">0.1761</text><text x="570" y="99" font-size="21" fill="#17292e" font-weight="700" text-anchor="start">FLUX.2</text><rect x="700" y="86" width="550" height="15" fill="#e7efed" stroke="none" stroke-width="1"/><rect x="700" y="86" width="88.31" height="15" fill="#006658" stroke="none" stroke-width="1"/><text x="1375" y="100" font-size="22" fill="#17292e" font-weight="700" text-anchor="end">0.1124</text>
</g>
</svg>
