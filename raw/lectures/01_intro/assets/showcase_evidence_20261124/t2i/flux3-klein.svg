<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="112" viewBox="0 0 1456 112" role="img" aria-labelledby="title desc">
<title id="title">Two latency measurements</title>
<desc id="desc">At 1 MP, the quickest NVIDIA GB300 build takes 0.55 s on the GPU for a distilled generation. BFL reports a separate median API time of 4.54 s for text-to-image.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<text x="12" y="36" font-size="27" fill="#17292e" font-weight="700" text-anchor="start">Where generation time goes</text><text x="12" y="67" font-size="22" fill="#43565b" font-weight="400" text-anchor="start">Distilled model · 16 steps · 1 MP</text><text x="12" y="95" font-size="18" fill="#43565b" font-weight="400" text-anchor="start">The two timers cover different work.</text><path d="M558,10 L558,100" fill="none" stroke="#bfceca" stroke-width="2"/><text x="585" y="29" font-size="21" fill="#006658" font-weight="700" text-anchor="start">On GPU</text><text x="585" y="65" font-size="36" fill="#17292e" font-weight="700" text-anchor="start">0.55 s</text><text x="585" y="94" font-size="20" fill="#43565b" font-weight="400" text-anchor="start">GB300 · fastest build</text><path d="M991,10 L991,100" fill="none" stroke="#bfceca" stroke-width="2"/><text x="1018" y="29" font-size="21" fill="#006658" font-weight="700" text-anchor="start">End-to-end API</text><text x="1018" y="65" font-size="36" fill="#17292e" font-weight="700" text-anchor="start">4.54 s</text><text x="1018" y="94" font-size="20" fill="#43565b" font-weight="400" text-anchor="start">Median · text to image</text>
</g>
</svg>
