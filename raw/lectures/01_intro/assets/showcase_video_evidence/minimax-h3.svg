<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 108" width="1420" height="108" font-family="Arial,Helvetica,sans-serif"><title>VisualVAE downsamples each spatial axis by 16, then 2-by-2 patchification reduces each by two again.</title><rect width="100%" height="100%" fill="#ffffff"/><text x="4" y="29" fill="#172d37" font-size="24" font-weight="700" text-anchor="start">How H3 tokenizes video</text><text x="4" y="68" fill="#425765" font-size="19" font-weight="550" text-anchor="start">Example spatial crop</text><rect x="325" y="6" width="254" height="92" rx="5" fill="#edf4f6"/><text x="338" y="36" fill="#425765" font-size="19" font-weight="550" text-anchor="start">Input crop</text><text x="338" y="76" fill="#075f79" font-size="26" font-weight="700" text-anchor="start">256 × 256 pixels</text><text x="587" y="64" fill="#425765" font-size="23" font-weight="550" text-anchor="start">→</text><rect x="602" y="6" width="296" height="92" rx="5" fill="#edf4f6"/><text x="615" y="36" fill="#425765" font-size="19" font-weight="550" text-anchor="start">Visual VAE · ÷16 per axis</text><text x="615" y="76" fill="#075f79" font-size="26" font-weight="700" text-anchor="start">16 × 16 latent sites</text><text x="904" y="64" fill="#425765" font-size="23" font-weight="550" text-anchor="start">→</text><rect x="931" y="6" width="296" height="92" rx="5" fill="#edf4f6"/><text x="944" y="36" fill="#425765" font-size="19" font-weight="550" text-anchor="start">Patchify · ÷2 per axis</text><text x="944" y="76" fill="#075f79" font-size="26" font-weight="700" text-anchor="start">8 × 8 visual tokens</text><text x="1247" y="47" fill="#425765" font-size="18" font-weight="550" text-anchor="start">Temporal stride</text><text x="1247" y="76" fill="#172d37" font-size="23" font-weight="700" text-anchor="start">remains 4×</text></svg>
