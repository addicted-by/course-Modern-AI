<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 198" width="326" height="198" font-family="Arial,Helvetica,sans-serif"><title>Three examples of the 30-second input plus output budget.</title><rect width="100%" height="100%" fill="#ffffff"/><text x="6" y="24" fill="#172d37" font-size="21" font-weight="700" text-anchor="start">How much video can fit?</text><text x="6" y="51" fill="#425765" font-size="17" font-weight="550" text-anchor="start">One request · 30-second budget</text><rect x="6" y="66" width="300" height="28" rx="2" fill="#dce7eb"/><text x="156" y="86" fill="#172d37" font-size="16" font-weight="650" text-anchor="middle">≤30 s out</text><rect x="6" y="106" width="100" height="28" rx="2" fill="#1c7589"/><text x="56" y="126" fill="white" font-size="16" font-weight="650" text-anchor="middle">10 s in</text><rect x="106" y="106" width="200" height="28" rx="2" fill="#dce7eb"/><text x="206" y="126" fill="#172d37" font-size="16" font-weight="650" text-anchor="middle">≤20 s out</text><rect x="6" y="146" width="150" height="28" rx="2" fill="#1c7589"/><text x="81" y="166" fill="white" font-size="16" font-weight="650" text-anchor="middle">15 s in</text><rect x="156" y="146" width="150" height="28" rx="2" fill="#dce7eb"/><text x="231" y="166" fill="#172d37" font-size="16" font-weight="650" text-anchor="middle">≤15 s out</text><text x="6" y="190" fill="#425765" font-size="16" font-weight="550" text-anchor="start">Video references total at most 15 s.</text></svg>
