project:
  type: website
  output-dir: _site
  pre-render: scripts/prepare-lectures.lua
  render:
    - index.qmd
    - raw/modules.qmd
    - raw/lectures.qmd
    - raw/seminars.qmd
    - raw/projects.qmd
  resources:
    - "assets/**"

metadata-files:
  - lectures.yml
  - _lecture-build.yml

filters:
  - scripts/lecture-table.lua

website:
  title: "MAI"
  navbar:
    logo: assets/logos/partners-dark.svg
    logo-alt: "Modern AI home — course partners"
    left:
      - href: index.qmd


        text: Home
      - href: raw/modules.qmd
        text: "Modules"
      - href: raw/lectures.qmd
        text: "Lectures"
      - href: raw/seminars.qmd
        text: "Seminars"
      - href: raw/projects.qmd
        text: "Projects"
    right:
      - icon: telegram
        href: https://t.me/+I-joDKs8iiIwOTQy
        aria-label: "Telegram Group"
      - icon: send
        href: https://t.me/addicted_by
        aria-label: "Telegram: @addicted_by"
      - icon: github
        href: https://github.com/addicted-by/course-Modern-AI/tree/main
        aria-label: "GitHub"
  page-footer:
    left: "Modern AI (2026–2027) · Aleksey Ryabykin"
    right:
      - icon: telegram
        text: "Telegram Group"
        href: https://t.me/+I-joDKs8iiIwOTQy
      - icon: send
        text: "<span>@</span>addicted_by"
        href: https://t.me/addicted_by
      - icon: github
        text: "GitHub"
        href: https://github.com/addicted-by/course-Modern-AI/tree/main

format:
  html:
    theme:
      - default
      - styles/course-site.scss
    body-classes: course-site
    css:
      - styles/contact_cards.css
      - styles/course-home.css
      - styles/course-modules.css
      - styles/course-materials.css
      - styles/course-projects.css
      - styles/footer.css
      - styles/logos.css
    toc: true
